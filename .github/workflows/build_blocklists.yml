name: Build IP blocklists

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */7 * * *"

permissions:
  contents: write

concurrency:
  group: firehol-blocklist-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build blocklists
        run: python scripts/build_blocklists.py

      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A dist README.md

          if git diff --cached --quiet; then
              echo "No generated changes."
              exit 0
          fi

          git commit -m "chore: update generated blocklists"
          git push
