name: Build MikroTik FireHOL blocklists

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-blocklists.yml"
      - "scripts/build_blocklists.py"

permissions:
  contents: write

concurrency:
  group: firehol-blocklist-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build blocklists
        run: python scripts/build_blocklists.py

      - name: Commit generated lists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f dist/*.rsc

          if git diff --cached --quiet; then
            echo "No blocklist changes."
            exit 0
          fi

          git commit -m "chore: update FireHOL MikroTik blocklists"
          git push

